[project]
name = "ask-the-textbook"
version = "0.1.0"
description = "A grounded physics tutor: answers explained simply and cited from an open textbook (hybrid RAG)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "fastapi>=0.142.4",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "sentence-transformers>=6.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tutor"]

[tool.ruff]
line-length = 100
