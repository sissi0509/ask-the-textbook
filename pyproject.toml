[project]
name = "learn-physics-with-feynman"
version = "0.1.0"
description = "Ask physics questions, get Feynman-style explanations grounded in an open textbook (RAG)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tutor"]

[tool.ruff]
line-length = 100
