name: ask-the-textbook

# Local Postgres with the pgvector extension preinstalled.
#   Start:  docker compose up -d
#   Stop:   docker compose down
#   Reset (deletes all data):  docker compose down -v
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: tutor
      POSTGRES_DB: tutor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor -d tutor"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
